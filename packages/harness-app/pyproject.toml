[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-app"
version = "0.1.0"
description = "Harness application — workspace, CLI, experiment orchestration"
requires-python = ">=3.11"
dependencies = [
    "harness-data>=0.1.0",
    "harness-ml>=0.1.0",
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harness = "harness.app.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

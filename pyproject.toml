[tool.uv.workspace]
members = [
    "packages/harness-data",
    "packages/harness-ml",
    "packages/harness-app",
    "packages/harness-server",
    "packages/harness-studio",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.uv.sources]
harness-data = { workspace = true }
harness-ml = { workspace = true }
harness-app = { workspace = true }
harness-server = { workspace = true }
harness-studio = { workspace = true }
